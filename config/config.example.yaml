# Binance Futures Grid Trading Bot Configuration
#
# Copy this file to config.yaml and adjust values.

exchange: binance
mode: paper  # paper or live

symbol: BTC/USDT:USDT  # CCXT futures symbol format

grid:
  type: arithmetic  # arithmetic or geometric
  upper_price: 110000.0
  lower_price: 90000.0
  grid_count: 10
  order_size: 0.001  # BTC per order
  leverage: 2

risk:
  max_position_btc: 0.01
  max_grid_count: 20
  stop_loss_pct: -5.0

backtest:
  trading_fee_pct: 0.04  # Taker fee rate
